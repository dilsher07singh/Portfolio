    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      The webfont is still requested by an @import inside src/index.css, so the
      browser cannot discover fonts.googleapis.com until that stylesheet has been
      fetched and parsed. Warming both origins here overlaps the connection setup
      with that fetch. gstatic.com serves the font files themselves and is
      requested anonymously, hence crossorigin.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      Entry animations are additive: content renders visible, and is only
      hidden for the duration of its reveal transition once we know scripts
      are running. Inline and synchronous so that static markup never paints
      visible and then flashes back out. See `.reveal` in src/index.css.
    -->
    <script>
      document.documentElement.classList.add("js");
    </script>
